quarkus.http.port=8081
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET, POST, PUT, DELETE
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true
quarkus.vertx.eventbus.idle-timeout=20000

quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true

%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# OIDC

keycloack-service/mp-rest/url=http://localhost:32770/realms/quarkus/protocol/openid-connect


# Habilita Quinoa
quarkus.quinoa.enabled=true
quarkus.quinoa.ui-dir=src/main/webapp/practicantes-frontend
quarkus.quinoa.base-path=/